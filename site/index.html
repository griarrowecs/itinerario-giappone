<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Itinerario Giappone</title>
<meta name="description" content="Guida di viaggio privata per il Giappone.">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  html,body{margin:0;padding:0;background:#EDE7DA;min-height:100%;}
  body{display:flex;justify-content:center;padding:0;}
  body > #app{margin:0 auto;min-height:100vh;border-radius:0;border:none;}
  @media (min-width:560px){
    html,body{padding:24px 0;}
    body > #app{min-height:auto;border-radius:14px;border:0.5px solid #DED6C2;box-shadow:0 8px 30px rgba(30,25,15,0.12);}
  }
</style>
</head>
<body>
<div id="app">
  <noscript>
    <div style="padding:40px 24px;text-align:center;font-family:sans-serif;background:#F7F4EC;border-radius:14px;">
      <p style="font-weight:700;font-size:15px;margin:0 0 8px;color:#211E19;">Questa pagina serve un vero browser</p>
      <p style="font-size:13px;color:#5A5548;line-height:1.5;margin:0;">Apri il link in Safari o Chrome, non nell'anteprima di un'altra app.</p>
    </div>
  </noscript>
  <div id="loading" style="padding:40px 24px;text-align:center;font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;background:#F7F4EC;border-radius:14px;">
    <p style="font-size:26px;margin:0 0 6px;">🔒</p>
    <p style="font-weight:700;font-size:15px;margin:0 0 4px;color:#211E19;">Itinerario Giappone</p>
    <p style="font-size:12.5px;color:#8B8577;margin:0 0 18px;">Inserisci la parola d'ordine per continuare</p>
    <input type="password" id="jg-gate-input" placeholder="Password" style="width:100%;max-width:220px;padding:10px 12px;border:0.5px solid #DED6C2;border-radius:8px;font-size:14px;text-align:center;margin-bottom:10px;box-sizing:border-box;">
    <br>
    <button id="jg-gate-btn" style="padding:9px 20px;border-radius:8px;border:none;background:#16283A;color:#F2EFE6;font-size:13px;font-weight:700;">Entra</button>
    <p id="jg-gate-error" style="display:none;color:#B0392C;font-size:12px;margin-top:10px;">Password errata, riprova.</p>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
